name: Continuous integration

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  build:
    name: Continuous integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    outputs:
      success: ${{ steps.success.outputs.success }}

    steps:
      - run: docker system prune --all --force
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install '--only-binary=:all:' --no-binary=markdown-table --requirement=ci/requirements.txt

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()
      - name: Print environment information
        run: c2cciutils-env

      - name: Pull
        run: make pull

      - name: Build
        run: make build

      - name: Checks
        run: make checks

      - name: Tests
        run: make tests
        env:
          PRIVATE_SSH_KEY: ${{secrets.PRIVATE_SSH_KEY}}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results
          path: results
          if-no-files-found: ignore
          retention-days: 5
        if: failure()

      - name: Acceptance
        run: make acceptance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance
          path: acceptance_tests/results
          if-no-files-found: ignore
          retention-days: 5
        if: failure()

      - run: c2cciutils-docker-logs
        if: failure()

      - run: git reset --hard
        if: failure()

      # The image is given to the publishing job, which is the only one with the write permissions.
      - run: docker save --output=/tmp/images.docker camptocamp/shared_config_manager:latest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images.docker
          path: /tmp/images.docker
          retention-days: 1

      # Mark as success
      - id: success
        run: echo "success=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    if: always()

    permissions:
      contents: read
      packages: write

    steps:
      - run: '[[ "${{ needs.build.outputs.success }}" == "true" ]]'

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          cache-python: true
          python-version: '3.13'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images.docker
          path: /tmp/
      - run: docker load --input=/tmp/images.docker

      - name: Publish
        run: uv run --locked --isolated --project=.github/publish tag-publish
        if: env.HAS_SECRETS == 'HAS_SECRETS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
